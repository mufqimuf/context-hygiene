<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1b2e"/>
      <stop offset="1" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="ok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ecca3"/><stop offset="1" stop-color="#2a9d8f"/>
    </linearGradient>
    <linearGradient id="warn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4a261"/><stop offset="1" stop-color="#e76f51"/>
    </linearGradient>
    <linearGradient id="brain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <rect width="880" height="420" rx="18" fill="url(#bg)"/>
  <text x="40" y="56" fill="#eaeaea" font-size="26" font-weight="700">context-hygiene</text>
  <text x="40" y="82" fill="#8d99ae" font-size="14">detect stale AI sessions → prevent hallucination drift</text>

  <!-- agent heads -->
  <g>
    <rect x="40" y="110" width="180" height="230" rx="14" fill="#232946" stroke="#3d4a6b"/>
    <text x="130" y="140" fill="#8d99ae" font-size="13" text-anchor="middle" font-weight="600">YOUR AI AGENT</text>

    <!-- fresh brain -->
    <circle cx="130" cy="195" r="34" fill="url(#brain)"/>
    <circle cx="130" cy="186" r="10" fill="#ffffff" opacity="0.9"/><circle cx="118" cy="198" r="6" fill="#ffffff" opacity="0.7"/><circle cx="142" cy="198" r="6" fill="#ffffff" opacity="0.7"/>
    <text x="130" y="252" fill="#4ecca3" font-size="13" text-anchor="middle" font-weight="600">DAY 1 · FRESH</text>
    <text x="130" y="272" fill="#8d99ae" font-size="11" text-anchor="middle">12k tokens · accurate</text>

    <line x1="130" y1="266" x2="130" y2="290" stroke="#3d4a6b"/>

    <!-- overloaded brain -->
    <circle cx="130" cy="310" r="26" fill="url(#warn)" opacity="0.25"/>
    <text x="130" y="324" fill="#e76f51" font-size="16" text-anchor="middle" font-weight="700">@_@</text>
  </g>

  <text x="235" y="235" fill="#e76f51" font-size="22">⟶</text>

  <!-- day 5 panel -->
  <g>
    <rect x="255" y="110" width="180" height="230" rx="14" fill="#232946" stroke="#e76f51"/>
    <text x="345" y="140" fill="#e76f51" font-size="13" text-anchor="middle" font-weight="600">DAY 5 · OVERLOADED</text>
    <text x="345" y="175" fill="#8d99ae" font-size="11" text-anchor="middle">50k+ tokens · 637 messages</text>
    <text x="345" y="193" fill="#8d99ae" font-size="11" text-anchor="middle">old context compressed…</text>
    <rect x="275" y="215" width="140" height="10" rx="5" fill="#3d4a6b"/>
    <rect x="275" y="215" width="132" height="10" rx="5" fill="url(#warn)"/>
    <rect x="275" y="233" width="140" height="10" rx="5" fill="#3d4a6b"/>
    <rect x="275" y="233" width="140" height="10" rx="5" fill="url(#warn)"/>
    <text x="345" y="278" fill="#f4a261" font-size="12" text-anchor="middle" font-weight="600">“hmm, kamu kan tadi bilang…”</text>
    <text x="345" y="296" fill="#e76f51" font-size="12" text-anchor="middle" font-weight="700">(you never said that)</text>
    <text x="345" y="325" fill="#8d99ae" font-size="11" text-anchor="middle">hallucination drift ✗</text>
  </g>

  <text x="450" y="235" fill="#4ecca3" font-size="22">⟶</text>

  <!-- the checker -->
  <g>
    <rect x="470" y="110" width="170" height="230" rx="14" fill="#232946" stroke="#4ecca3"/>
    <text x="555" y="140" fill="#4ecca3" font-size="13" text-anchor="middle" font-weight="600">context-hygiene</text>
    <text x="555" y="158" fill="#8d99ae" font-size="10" text-anchor="middle">python3, zero deps</text>
    <rect x="490" y="175" width="130" height="26" rx="6" fill="#1a1b2e" stroke="#3d4a6b"/>
    <text x="555" y="192" fill="#a78bfa" font-size="11" text-anchor="middle">age &gt; 48h ?</text>
    <rect x="490" y="209" width="130" height="26" rx="6" fill="#1a1b2e" stroke="#3d4a6b"/>
    <text x="555" y="226" fill="#a78bfa" font-size="11" text-anchor="middle">tokens &gt; 60k ?</text>
    <rect x="490" y="243" width="130" height="26" rx="6" fill="#1a1b2e" stroke="#3d4a6b"/>
    <text x="555" y="260" fill="#a78bfa" font-size="11" text-anchor="middle">idle &lt; 48h ?</text>
    <rect x="490" y="282" width="130" height="30" rx="6" fill="url(#warn)"/>
    <text x="555" y="302" fill="#1a1b2e" font-size="12" text-anchor="middle" font-weight="700">⚠ warning</text>
    <text x="555" y="332" fill="#8d99ae" font-size="10" text-anchor="middle">cron · daily 09:00</text>
  </g>

  <text x="655" y="235" fill="#4ecca3" font-size="22">⟶</text>

  <!-- two modes -->
  <g>
    <rect x="675" y="110" width="165" height="106" rx="14" fill="#232946" stroke="#4ecca3"/>
    <text x="757" y="136" fill="#4ecca3" font-size="13" text-anchor="middle" font-weight="700">MODE: notify</text>
    <text x="757" y="158" fill="#8d99ae" font-size="11" text-anchor="middle">► Telegram / chat</text>
    <text x="757" y="176" fill="#8d99ae" font-size="11" text-anchor="middle">“ketik /new ya”</text>
    <text x="757" y="200" fill="#4ecca3" font-size="10" text-anchor="middle">recommended ✓</text>

    <rect x="675" y="234" width="165" height="106" rx="14" fill="#232946" stroke="#a78bfa"/>
    <text x="757" y="260" fill="#a78bfa" font-size="13" text-anchor="middle" font-weight="700">MODE: auto</text>
    <text x="757" y="282" fill="#8d99ae" font-size="11" text-anchor="middle">⚙ reset langsung</text>
    <text x="757" y="300" fill="#8d99ae" font-size="11" text-anchor="middle">idle-guard · archived</text>
    <text x="757" y="324" fill="#a78bfa" font-size="10" text-anchor="middle">no ask · no delete</text>
  </g>

  <!-- result banner -->
  <rect x="40" y="360" width="800" height="40" rx="10" fill="#1a1b2e" stroke="#4ecca3"/>
  <text x="440" y="386" fill="#4ecca3" font-size="14" text-anchor="middle" font-weight="600">result: fresh session every few days → accurate answers, no drift, memory stays curated ✓</text>
</svg>
